<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高性能流量生成器</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/search-bar.css">
  <link rel="stylesheet" href="css/pagination.css">
</head>
<body>
  <div class="container">
    <!-- 顶部菜单栏 -->
          <div class="header">
        <a id="nav_hptg" href="#" onclick="switchSystem('hptg');return false;" class="active">高性能流量生成器</a>
        <a id="nav_pcap_analyzer" href="#" onclick="switchSystem('pcap_analyzer');return false;">报文分析器</a>
        <a id="nav_common" href="#" onclick="switchSystem('common');return false;">常用功能</a>
      </div>
    
    <!-- 主内容区域 -->
    <div class="main" id="main-content">
      <!-- 内容将通过JavaScript动态加载 -->
    </div>
    </div>

  <!-- 加载所有JavaScript模块 -->
  <script src="common-core.js"></script>
  <script src="common-storage.js"></script>
  <script src="overview.js"></script>
  <script src="overview-charts.js"></script>
  <script src="overview-ws.js"></script>
  <script src="task-core.js"></script>
  <script src="task-render.js"></script>
  <script src="task-table.js"></script>
  <script src="task-actions.js"></script>
  <script src="task-start-stop.js"></script>
  <script src="task-presets.js"></script>
  <script src="task-utils.js"></script>
  <script src="task-presets.js"></script>
  <script src="pagination.js"></script>
  <script src="protocols.js"></script>
  <script src="presets.js"></script>
  <script src="history.js"></script>
  <script src="pcap.js"></script>
  <script src="settings.js"></script>
  
  <script>
    // 全局状态管理
    let systemStates = {
      hptg: { currentPage: 'overview', pageData: {} },
      pcap_analyzer: { currentPage: 'overview', pageData: {} },
      common: { currentPage: 'overview', pageData: {} }
    };
    
    let currentSystem = 'hptg';
    
    // 系统切换逻辑
    function switchSystem(system) {
      // 保存当前系统状态
      saveCurrentSystemState();
      
      // 更新顶层菜单状态
      document.querySelectorAll('.header a').forEach(nav => nav.classList.remove('active'));
      document.getElementById(`nav_${system}`).classList.add('active');
      
      // 切换到新系统
      currentSystem = system;
      
      // 加载对应系统的内容
      loadSystemContent(system);
      
      // 恢复新系统的状态
      restoreSystemState(system);
    }
    
    // 保存当前系统状态
    function saveCurrentSystemState() {
      if (currentSystem && document.querySelector('.sidebar-menu')) {
        const activeNav = document.querySelector('.sidebar-menu a.active');
        if (activeNav) {
          const pageId = activeNav.id.replace('nav_', '');
          systemStates[currentSystem].currentPage = pageId;
          
          // 保存页面特定数据（如任务列表状态、搜索条件等）
          systemStates[currentSystem].pageData = {
            scrollPosition: document.querySelector('.subtasks')?.scrollTop || 0,
            searchFilters: getCurrentSearchFilters(),
            paginationState: getCurrentPaginationState()
          };
        }
      }
    }
    
    // 恢复系统状态
    function restoreSystemState(system) {
      const state = systemStates[system];
      if (state && state.currentPage) {
        // 延迟执行，确保DOM加载完成
        setTimeout(() => {
          switchPage(state.currentPage);
          
          // 恢复页面特定数据
          if (state.pageData) {
            restorePageData(state.pageData);
          }
        }, 100);
      }
    }
    
    // 获取当前搜索过滤器状态
    function getCurrentSearchFilters() {
      const filters = {};
      const searchInputs = document.querySelectorAll('.search-group input, .search-group select');
      searchInputs.forEach(input => {
        if (input.value) {
          filters[input.name || input.id] = input.value;
        }
      });
      return filters;
    }
    
    // 获取当前分页状态
    function getCurrentPaginationState() {
      const pagination = document.querySelector('.pagination');
      if (pagination) {
        return {
          currentPage: pagination.querySelector('.current')?.textContent || 1,
          pageSize: document.querySelector('.page-size-select')?.value || 10
        };
      }
      return {};
    }
    
    // 恢复页面数据
    function restorePageData(pageData) {
      // 恢复滚动位置
      if (pageData.scrollPosition) {
        const subtasks = document.querySelector('.subtasks');
        if (subtasks) {
          setTimeout(() => {
            subtasks.scrollTop = pageData.scrollPosition;
          }, 200);
        }
      }
      
      // 恢复搜索过滤器
      if (pageData.searchFilters) {
        Object.keys(pageData.searchFilters).forEach(key => {
          const input = document.querySelector(`[name="${key}"], #${key}`);
          if (input) {
            input.value = pageData.searchFilters[key];
          }
        });
      }
      
      // 恢复分页状态
      if (pageData.paginationState) {
        // 这里可以调用相应的分页函数来恢复状态
        // 具体实现取决于分页组件的API
      }
    }
    
    // 加载系统内容
    function loadSystemContent(system) {
      const mainContent = document.getElementById('main-content');
      
      // 如果系统内容已经存在，只是隐藏/显示，不重新创建
      const existingSystem = document.querySelector(`[data-system="${system}"]`);
      if (existingSystem) {
        // 隐藏所有系统
        document.querySelectorAll('[data-system]').forEach(sys => {
          sys.style.display = 'none';
        });
        // 显示目标系统
        existingSystem.style.display = 'flex';
        return;
      }
      
      // 如果系统内容不存在，则创建
      switch(system) {
        case 'hptg':
          // 加载高性能流量生成器系统
          loadHPTSystem();
          break;
        case 'pcap_analyzer':
          // 加载报文分析器系统
          loadPCAPSystem();
          break;
        case 'common':
          // 加载常用功能系统
          loadCommonSystem();
          break;
      }
    }
    
    // 加载高性能流量生成器系统
    function loadHPTSystem() {
      const mainContent = document.getElementById('main-content');
      
      // 检查是否已经存在HPTG系统
      const existingHPTG = document.querySelector('[data-system="hptg"]');
      if (existingHPTG) {
        existingHPTG.style.display = 'flex';
        return;
      }
      
      // 创建新的HPTG系统
      const hptgSystem = document.createElement('div');
      hptgSystem.className = 'system-content';
      hptgSystem.setAttribute('data-system', 'hptg');
      hptgSystem.innerHTML = `
        <div class="sidebar">
          <div class="sidebar-menu">
            <a id="nav_overview" href="#" onclick="switchPage('overview');return false;" class="active">
              <span class="menu-icon">📊</span>
              <span class="menu-text">概览</span>
            </a>
            <a id="nav_tasks" href="#" onclick="switchPage('tasks');return false;">
              <span class="menu-icon">⚡</span>
              <span class="menu-text">任务</span>
            </a>
            <a id="nav_pcap" href="#" onclick="switchPage('pcap');return false;">
              <span class="menu-icon">📁</span>
              <span class="menu-text">PCAP</span>
            </a>
            <a id="nav_history" href="#" onclick="switchPage('history');return false;">
              <span class="menu-icon">🕒</span>
              <span class="menu-text">历史配置</span>
            </a>
            <a id="nav_settings" href="#" onclick="switchPage('settings');return false;">
              <span class="menu-icon">⚙️</span>
              <span class="menu-text">设置</span>
            </a>
          </div>
        </div>
        <div class="content-area">
          <div id="page-content">
            <!-- 页面内容将通过switchPage动态加载 -->
          </div>
        </div>
      `;
      
      // 将HPTG系统添加到主内容区域
      mainContent.appendChild(hptgSystem);
      
      // 默认加载概览页面
      switchPage('overview');
    }
    
    // 加载报文分析器系统
    function loadPCAPSystem() {
      const mainContent = document.getElementById('main-content');
      
      // 检查是否已经存在PCAP系统
      const existingPCAP = document.querySelector('[data-system="pcap_analyzer"]');
      if (existingPCAP) {
        existingPCAP.style.display = 'flex';
        return;
      }
      
      // 创建新的PCAP系统
      const pcapSystem = document.createElement('div');
      pcapSystem.className = 'system-content';
      pcapSystem.setAttribute('data-system', 'pcap_analyzer');
      pcapSystem.innerHTML = `
        <div class="coming-soon">
          <h2>报文分析器</h2>
          <p>功能开发中，敬请期待...</p>
        </div>
      `;
      
      // 将PCAP系统添加到主内容区域
      mainContent.appendChild(pcapSystem);
    }
    
    // 加载常用功能系统
    function loadCommonSystem() {
      const mainContent = document.getElementById('main-content');
      
      // 检查是否已经存在常用功能系统
      const existingCommon = document.querySelector('[data-system="common"]');
      if (existingCommon) {
        existingCommon.style.display = 'flex';
        return;
      }
      
      // 创建新的常用功能系统
      const commonSystem = document.createElement('div');
      commonSystem.className = 'system-content';
      commonSystem.setAttribute('data-system', 'common');
      commonSystem.innerHTML = `
        <div class="coming-soon">
          <h2>常用功能</h2>
          <p>功能开发中，敬请期待...</p>
        </div>
      `;
      
      // 将常用功能系统添加到主内容区域
      mainContent.appendChild(commonSystem);
    }
    
    // 页面切换逻辑
    function switchPage(page) {
      // 更新侧边栏菜单状态
      document.querySelectorAll('.sidebar-menu a').forEach(nav => nav.classList.remove('active'));
      document.getElementById(`nav_${page}`).classList.add('active');
      
      // 保存当前页面状态到当前系统
      if (currentSystem) {
        systemStates[currentSystem].currentPage = page;
      }
      
      // 加载对应页面内容
      loadPageContent(page);
    }
    
    // 加载页面内容
    function loadPageContent(page) {
      const pageContent = document.getElementById('page-content');
      
      switch(page) {
        case 'overview':
          loadOverviewPage(pageContent);
          break;
        case 'tasks':
          loadTasksPage(pageContent);
          break;
        case 'pcap':
          loadPCAPPage(pageContent);
          break;
        case 'history':
          loadHistoryPage(pageContent);
          break;
        case 'settings':
          loadSettingsPage(pageContent);
          break;
      }
    }
    
    // 页面加载函数（这些函数将在对应的JS模块中实现）
    function loadOverviewPage(container) {
      // 调用overview.js中的函数
      if (typeof loadOverviewContent === 'function') {
        loadOverviewContent(container);
      }
    }
    
    function loadTasksPage(container) {
      // 调用task-core.js中的函数
      if (typeof loadTasksContent === 'function') {
        loadTasksContent(container);
      }
    }
    
    function loadPCAPPage(container) {
      // 调用pcap.js中的函数
      if (typeof loadPCAPContent === 'function') {
        loadPCAPContent(container);
      }
    }
    
    function loadHistoryPage(container) {
      // 调用history.js中的函数
      if (typeof loadHistoryContent === 'function') {
        loadHistoryContent(container);
      }
    }
    
    function loadSettingsPage(container) {
      // 调用settings.js中的函数
      if (typeof loadSettingsContent === 'function') {
        loadSettingsContent(container);
      }
    }
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
      // 预加载所有系统
      loadHPTSystem();
      loadPCAPSystem();
      loadCommonSystem();
      
      // 隐藏非HPTG系统
      document.querySelectorAll('[data-system]:not([data-system="hptg"])').forEach(sys => {
        sys.style.display = 'none';
      });
      
      // 初始化系统状态
      currentSystem = 'hptg';
      systemStates.hptg.currentPage = 'overview';
    });
  </script>
</body>
</html>
