<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>功能测试页面</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
    .success { color: green; }
    .error { color: red; }
    button { margin: 5px; padding: 10px; }
  </style>
</head>
<body>
  <h1>功能模块测试</h1>
  
  <div class="test-section">
    <h2>通用功能测试</h2>
    <button onclick="testCommon()">测试通用功能</button>
    <div id="common-result"></div>
  </div>
  
  <div class="test-section">
    <h2>任务管理测试</h2>
    <button onclick="testTasks()">测试任务功能</button>
    <div id="tasks-result"></div>
  </div>
  
  <div class="test-section">
    <h2>页面切换测试</h2>
    <button onclick="testPageSwitch()">测试页面切换</button>
    <div id="switch-result"></div>
  </div>
  
  <div class="test-section">
    <h2>Toast提示测试</h2>
    <button onclick="testToast()">测试Toast</button>
    <div id="toast-result"></div>
  </div>

  <!-- 引入功能模块 -->
  <script src="common.js"></script>
  <script src="overview.js"></script>
  <script src="tasks.js"></script>
  <script src="pcap.js"></script>
  <script src="history.js"></script>
  <script src="settings.js"></script>
  
  <script>
    function testCommon() {
      var result = document.getElementById('common-result');
      try {
        // 测试基本函数
        if (typeof getElement === 'function') {
          result.innerHTML = '<span class="success">✓ getElement函数正常</span><br>';
        } else {
          result.innerHTML = '<span class="error">✗ getElement函数缺失</span><br>';
          return;
        }
        
        if (typeof showToast === 'function') {
          result.innerHTML += '<span class="success">✓ showToast函数正常</span><br>';
        } else {
          result.innerHTML += '<span class="error">✗ showToast函数缺失</span><br>';
        }
        
        if (typeof switchPage === 'function') {
          result.innerHTML += '<span class="success">✓ switchPage函数正常</span><br>';
        } else {
          result.innerHTML += '<span class="error">✗ switchPage函数缺失</span><br>';
        }
        
        result.innerHTML += '<span class="success">✓ 通用功能测试通过</span>';
      } catch (e) {
        result.innerHTML = '<span class="error">✗ 测试失败: ' + e.message + '</span>';
      }
    }
    
    function testTasks() {
      var result = document.getElementById('tasks-result');
      try {
        // 测试任务相关函数
        if (typeof addSubtask === 'function') {
          result.innerHTML = '<span class="success">✓ addSubtask函数正常</span><br>';
        } else {
          result.innerHTML = '<span class="error">✗ addSubtask函数缺失</span><br>';
          return;
        }
        
        if (typeof renderSubtasks === 'function') {
          result.innerHTML += '<span class="success">✓ renderSubtasks函数正常</span><br>';
        } else {
          result.innerHTML += '<span class="error">✗ renderSubtasks函数缺失</span><br>';
        }
        
        // 测试添加任务
        var initialCount = state.subtasks.length;
        addSubtask();
        if (state.subtasks.length > initialCount) {
          result.innerHTML += '<span class="success">✓ 任务添加功能正常</span><br>';
        } else {
          result.innerHTML += '<span class="error">✗ 任务添加功能异常</span><br>';
        }
        
        result.innerHTML += '<span class="success">✓ 任务功能测试通过</span>';
      } catch (e) {
        result.innerHTML = '<span class="error">✗ 测试失败: ' + e.message + '</span>';
      }
    }
    
    function testPageSwitch() {
      var result = document.getElementById('switch-result');
      try {
        // 测试页面切换
        var originalPage = state.page;
        switchPage('tasks');
        if (state.page === 'tasks') {
          result.innerHTML = '<span class="success">✓ 页面切换到tasks正常</span><br>';
        } else {
          result.innerHTML = '<span class="error">✗ 页面切换异常</span><br>';
          return;
        }
        
        switchPage('overview');
        if (state.page === 'overview') {
          result.innerHTML += '<span class="success">✓ 页面切换到overview正常</span><br>';
        } else {
          result.innerHTML += '<span class="error">✗ 页面切换异常</span><br>';
        }
        
        // 恢复原始页面
        switchPage(originalPage);
        result.innerHTML += '<span class="success">✓ 页面切换测试通过</span>';
      } catch (e) {
        result.innerHTML = '<span class="error">✗ 测试失败: ' + e.message + '</span>';
      }
    }
    
    function testToast() {
      var result = document.getElementById('toast-result');
      try {
        showToast('这是一个测试提示', true);
        result.innerHTML = '<span class="success">✓ Toast提示功能正常</span>';
      } catch (e) {
        result.innerHTML = '<span class="error">✗ Toast测试失败: ' + e.message + '</span>';
      }
    }
    
    // 页面加载完成后自动运行测试
    window.addEventListener('load', function() {
      console.log('所有模块加载完成，开始测试...');
      testCommon();
    });
  </script>
</body>
</html>
