<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>简单测试页面</title>
    <style>
        body { 
            background: #0f1419; 
            color: #f0f6fc; 
            padding: 20px; 
            font-family: Arial, sans-serif;
        }
        .box { 
            background: #1e2329; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 10px 0;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧪 页面显示测试</h1>
        <p>如果您能看到这个页面，说明基本的HTML和CSS正常工作。</p>
        <p>背景应该是深色(#0f1419)，文字应该是浅色(#f0f6fc)。</p>
    </div>

    <div class="box">
        <h2>🔧 Vue.js 测试</h2>
        <div id="app">
            <p>{{ message }}</p>
            <button @click="count++">点击测试 ({{ count }})</button>
        </div>
    </div>

    <div class="box">
        <h2>📱 浏览器信息</h2>
        <p>User Agent: <span id="ua"></span></p>
        <p>屏幕尺寸: <span id="screen"></span></p>
        <p>窗口尺寸: <span id="window"></span></p>
    </div>

    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        // 显示浏览器信息
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('screen').textContent = `${screen.width}x${screen.height}`;
        document.getElementById('window').textContent = `${window.innerWidth}x${window.innerHeight}`;

        // Vue.js 应用
        if (typeof Vue !== 'undefined') {
            const { createApp } = Vue;
            createApp({
                data() {
                    return {
                        message: '✅ Vue.js 加载成功！',
                        count: 0
                    }
                }
            }).mount('#app');
        } else {
            document.getElementById('app').innerHTML = '<p style="color: red;">❌ Vue.js 加载失败</p>';
        }

        console.log('页面加载完成');
        console.log('Vue:', typeof Vue);
    </script>
</body>
</html>
