<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高性能流量生成器 - 调试版本</title>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0f1419;
            color: #f0f6fc;
            font-family: Arial, sans-serif;
        }
        
        .debug-info {
            background: #1e2329;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }
        
        .test-section {
            background: #1e2329;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 3px solid #58a6ff;
        }
        
        button {
            background: #58a6ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        
        button:hover {
            background: #4a90e2;
        }
        
        .status {
            font-weight: bold;
        }
        
        .status.ok {
            color: #3fb950;
        }
        
        .status.error {
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h2>🔧 系统调试信息</h2>
        <div class="test-section">
            <h3>基础显示测试</h3>
            <p>如果您能看到此页面，说明基本的HTML和CSS加载正常。</p>
            <p class="status ok">✅ HTML/CSS 加载正常</p>
        </div>
        
        <div class="test-section">
            <h3>Vue.js 测试</h3>
            <div id="vue-test">
                <p v-if="vueLoaded" class="status ok">✅ Vue.js 加载成功: {{ message }}</p>
                <p v-else class="status error">❌ Vue.js 加载失败</p>
                <button @click="testFunction">测试按钮 (点击数: {{ clickCount }})</button>
            </div>
        </div>
        
        <div class="test-section">
            <h3>网络连接测试</h3>
            <button onclick="testAPI()">测试API连接</button>
            <div id="api-result"></div>
        </div>
        
        <div class="test-section">
            <h3>控制台日志</h3>
            <p>请打开浏览器开发者工具(F12) → Console 查看详细日志</p>
            <button onclick="console.log('手动测试日志')">输出测试日志</button>
        </div>
        
        <div class="test-section">
            <h3>原版页面链接</h3>
            <a href="index.html" style="color: #58a6ff;">访问原版页面</a> | 
            <a href="index-redesigned.html" style="color: #58a6ff;">访问重新设计页面</a>
        </div>
    </div>

    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        console.log('🔧 调试页面开始加载...');
        
        // 检查Vue加载
        function checkVue() {
            if (typeof Vue !== 'undefined') {
                console.log('✅ Vue.js 加载成功:', Vue.version);
                
                const { createApp } = Vue;
                
                createApp({
                    data() {
                        return {
                            vueLoaded: true,
                            message: 'Vue.js 工作正常',
                            clickCount: 0
                        }
                    },
                    methods: {
                        testFunction() {
                            this.clickCount++;
                            console.log('按钮被点击，次数:', this.clickCount);
                        }
                    },
                    mounted() {
                        console.log('✅ Vue应用挂载成功');
                    }
                }).mount('#vue-test');
                
            } else {
                console.error('❌ Vue.js 未加载');
                document.getElementById('vue-test').innerHTML = '<p class="status error">❌ Vue.js 加载失败</p>';
            }
        }
        
        // API测试
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<p>🔄 测试中...</p>';
            
            try {
                const response = await fetch('/api/hptg/status');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<p class="status ok">✅ API连接成功</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<p class="status error">❌ API返回错误: ${response.status}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="status error">❌ API连接失败: ${error.message}</p>`;
                console.error('API测试失败:', error);
            }
        }
        
        // 页面加载完成后检查
        window.addEventListener('load', function() {
            console.log('📄 页面加载完成');
            setTimeout(checkVue, 100); // 延迟检查Vue，确保CDN加载完成
        });
        
        // 检查样式
        console.log('🎨 检查CSS变量:');
        console.log('--bg-primary:', getComputedStyle(document.documentElement).getPropertyValue('--bg-primary'));
        
        // 输出系统信息
        console.log('🌐 浏览器信息:', navigator.userAgent);
        console.log('📱 屏幕尺寸:', window.screen.width + 'x' + window.screen.height);
    </script>
</body>
</html>
