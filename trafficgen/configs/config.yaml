# Server configuration
server:
  host: "0.0.0.0"
  port: 8082
  mode: "release" # debug, release, test

# Database configuration
database:
  type: "sqlite" # postgres, sqlite
  postgres:
    host: "localhost"
    port: 5432
    user: "trafficgen"
    password: "trafficgen123"
    dbname: "trafficgen"
    sslmode: "disable"
  sqlite:
    path: "./data/trafficgen.db"
  pool:
    max_open: 100
    max_idle: 10
    conn_lifetime: "1h"

# Redis configuration
redis:
  enabled: true
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 100

# Engine configuration
engine:
  config_workers: 4
  packet_workers: 1
  output_workers: 1
  buffer_size: 4096
  queue_size: 1024

# Logging configuration
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, console
  output: "stdout" # stdout, file
  file:
    path: "./logs/trafficgen.log"
    max_size: 100  # MB
    max_backups: 5
    max_age: 30    # days
    compress: true

# Authentication configuration
auth:
  jwt_secret: "your-secret-key-change-in-production"
  jwt_issuer: "trafficgen"
  jwt_expires_in: 24  # hours
  admin:
    username: "admin"
    password: "admin"
    email: "admin@trafficgen.local"

# Rate limiting
rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

# Metrics configuration
metrics:
  enabled: true
  path: "/metrics"

# Filesystem configuration -- content-addressed filesystem backing
# FileSource payload resolution (ftp/sip/sctp/http/icmp planners).
# Override with the --fs-root CLI flag when running the server.
filesystem:
  root: "data/filesystem"

# MCP configuration (flowB). stdio off -- we use HTTP so the same trafficgen
# process can serve both REST (port 8082) and MCP HTTP (port 8081) without
# stdout conflicts.
mcp:
  enabled: true
  service_user_id: "admin"
  service_user_role: "user"
  service_account_password: "flowb-mcp-change-me"
  # HTTP transport auth key. Claude Code sends this as X-MCP-Key header.
  # MUST be non-empty when http.enabled=true or NewHTTPServer refuses to start.
  api_key: "dev-mcp-key"

  transports:
    stdio: false
    http:
      enabled: true
      listen: "127.0.0.1:8081"
      cors_origins:
        - "http://localhost:*"
        - "http://127.0.0.1:*"

  max_wait_timeout_seconds: 3600
  audit_log: true
  max_subscriptions: 100
