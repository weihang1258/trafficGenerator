# Server configuration
server:
  host: "0.0.0.0"
  port: 8082
  mode: "release" # debug, release, test

# Database configuration
database:
  type: "sqlite" # postgres, sqlite
  postgres:
    host: "postgres"
    port: 5432
    user: "trafficgen"
    password: "${POSTGRES_PASSWORD}"
    dbname: "trafficgen"
    sslmode: "disable"
  sqlite:
    path: "./data/trafficgen.db"
  pool:
    max_open: 100
    max_idle: 10
    conn_lifetime: "1h"

# Redis configuration
redis:
  enabled: true
  addr: "redis:6379"
  password: ""
  db: 0
  pool_size: 100

# Engine configuration
engine:
  config_workers: 4
  packet_workers: 8
  output_workers: 4
  buffer_size: 4096
  queue_size: 1024

# Logging configuration
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, console
  output: "stdout" # stdout, file
  file:
    path: "./logs/trafficgen.log"
    max_size: 100  # MB
    max_backups: 5
    max_age: 30    # days
    compress: true

# Authentication configuration
auth:
  jwt_secret: "${JWT_SECRET}"
  jwt_issuer: "trafficgen"
  jwt_expires_in: 24  # hours
  admin:
    username: "${ADMIN_USERNAME}"
    password: "${ADMIN_PASSWORD}"
    email: "${ADMIN_EMAIL}"

# Rate limiting
rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

# Metrics configuration
metrics:
  enabled: true
  path: "/metrics"

# Filesystem configuration -- content-addressed filesystem backing
# FileSource payload resolution (ftp/sip/sctp/http/icmp planners).
# Override with the --fs-root CLI flag when running the server.
filesystem:
  root: "data/filesystem"
