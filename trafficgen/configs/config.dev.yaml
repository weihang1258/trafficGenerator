# Server configuration
server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug, release, test

# Database configuration
database:
  type: "sqlite" # postgres, sqlite
  postgres:
    host: "localhost"
    port: 5432
    user: "trafficgen"
    password: "trafficgen123"
    dbname: "trafficgen"
    sslmode: "disable"
  sqlite:
    path: "./data/trafficgen.db"
  pool:
    max_open: 100
    max_idle: 10
    conn_lifetime: "1h"

# Redis configuration
redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 100

# Engine configuration
engine:
  config_workers: 4
  packet_workers: 8
  output_workers: 4
  buffer_size: 4096
  queue_size: 1024
  min_mtu: 2000  # 任务启动时强制 NIC MTU >= 此值；< 则执行 `ip link set dev <iface> mtu 2000` (需 root/CAP_NET_ADMIN)；0 禁用；原值不恢复

# Logging configuration
logging:
  level: "debug" # debug, info, warn, error
  format: "console" # json, console
  output: "stdout" # stdout, file
  file:
    path: "./logs/trafficgen.log"
    max_size: 100  # MB
    max_backups: 5
    max_age: 30    # days
    compress: true

# Authentication configuration
auth:
  jwt_secret: "dev-secret-key-change-in-production"
  jwt_issuer: "trafficgen"
  jwt_expires_in: 24  # hours
  admin:
    username: "admin"
    password: "admin"
    email: "admin@trafficgen.local"

# Rate limiting
rate_limit:
  enabled: false
  requests_per_second: 100
  burst: 200

# Metrics configuration
metrics:
  enabled: true
  path: "/metrics"

# MCP (Model Context Protocol) server -- flowB
# Start with: trafficgen --config configs/config.dev.yaml
# Claude Code connects via .mcp.json at project root.
mcp:
  enabled: true
  service_user_id: "mcp-service"
  service_user_role: "user"
  service_account_password: "flowb-mcp-change-me"
  # HTTP transport auth key. Claude Code sends this as X-MCP-Key header.
  # MUST be non-empty when http.enabled=true or NewHTTPServer refuses to start.
  api_key: "dev-mcp-key"

  transports:
    # stdio off -- we use HTTP so the same trafficgen process can serve both
    # REST (port 8080) and MCP HTTP (port 8081) without stdout conflicts.
    stdio: false
    http:
      enabled: true
      listen: "127.0.0.1:8081"
      cors_origins:
        - "http://localhost:*"
        - "http://127.0.0.1:*"

  max_wait_timeout_seconds: 3600
  audit_log: true
  max_subscriptions: 100

# Filesystem configuration -- content-addressed filesystem backing
# FileSource payload resolution (ftp/sip/sctp/http/icmp planners).
# Override with the --fs-root CLI flag when running the server.
filesystem:
  root: "data/filesystem"
