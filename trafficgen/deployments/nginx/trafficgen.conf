# Nginx 配置文件 - Traffic Generator

# 上游后端服务器
upstream trafficgen_backend {
    server localhost:8080;
    # 如果有多个后端实例，可以添加负载均衡
    # server localhost:8081;
    # server localhost:8082;
}

# HTTP 服务器配置
server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名或 IP

    # 访问日志
    access_log /var/log/nginx/trafficgen_access.log;
    error_log /var/log/nginx/trafficgen_error.log;

    # 前端静态文件
    location / {
        root /var/www/trafficgen/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;  # SPA 路由支持

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://trafficgen_backend;
        proxy_http_version 1.1;

        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 支持
    location /ws {
        proxy_pass http://trafficgen_backend;
        proxy_http_version 1.1;

        # WebSocket 必需的头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 超时设置（保持长连接）
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 健康检查
    location /health {
        proxy_pass http://trafficgen_backend;
        access_log off;
    }

    # Prometheus 监控指标
    location /metrics {
        proxy_pass http://trafficgen_backend;

        # 可选：限制访问（只允许监控服务器访问）
        # allow 192.168.1.0/24;
        # deny all;
    }
}

