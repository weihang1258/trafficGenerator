apiVersion: v1
kind: Secret
metadata:
  name: trafficgen-secret
  namespace: trafficgen
  labels:
    app: trafficgen
    component: secret
type: Opaque
stringData:
  # 数据库密码
  db-password: "trafficgen_secret_change_me"

  # JWT 密钥（用于认证）
  jwt-secret: "your-jwt-secret-key-change-me-in-production"

  # API 密钥（可选）
  api-key: "your-api-key-change-me"

  # Grafana 管理员密码
  grafana-admin-password: "admin_change_me"

  # Prometheus 基本认证密码（可选）
  prometheus-password: "prometheus_change_me"

---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: trafficgen
  labels:
    app: postgres
    component: database
type: Opaque
stringData:
  # PostgreSQL 超级用户密码
  postgres-password: "postgres_admin_change_me"

  # Traffic Generator 数据库用户密码
  password: "trafficgen_secret_change_me"

  # 数据库名称
  database: "trafficgen"

  # 用户名
  username: "trafficgen"

---
# Redis Secret（可选）
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: trafficgen
  labels:
    app: redis
    component: cache
type: Opaque
stringData:
  # Redis 密码
  password: "redis_secret_change_me"

---
# TLS Secret（用于 Ingress HTTPS）
apiVersion: v1
kind: Secret
metadata:
  name: trafficgen-tls
  namespace: trafficgen
  labels:
    app: trafficgen
    component: tls
type: kubernetes.io/tls
data:
  # 证书和密钥需要使用 base64 编码
  # 生成命令：
  # kubectl create secret tls trafficgen-tls --cert=path/to/cert.crt --key=path/to/cert.key -n trafficgen --dry-run=client -o yaml
  # tls.crt: <base64-encoded-cert>
  # tls.key: <base64-encoded-key>

---
# Docker Registry Secret（用于私有镜像仓库）
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: trafficgen
  labels:
    app: trafficgen
    component: registry
type: kubernetes.io/dockerconfigjson
data:
  # Docker 配置 JSON（base64 编码）
  # 生成命令：
  # kubectl create secret docker-registry docker-registry-secret \
  #   --docker-server=<your-registry-server> \
  #   --docker-username=<your-username> \
  #   --docker-password=<your-password> \
  #   --docker-email=<your-email> \
  #   -n trafficgen --dry-run=client -o yaml
  # .dockerconfigjson: <base64-encoded-docker-config>
