apiVersion: v1
kind: Service
metadata:
  name: trafficgen-service
  namespace: trafficgen
  labels:
    app: trafficgen
    component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 8080
      protocol: TCP
  selector:
    app: trafficgen

---
# NodePort Service（用于外部访问，可选）
apiVersion: v1
kind: Service
metadata:
  name: trafficgen-nodeport
  namespace: trafficgen
  labels:
    app: trafficgen
    component: api
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
  selector:
    app: trafficgen

---
# LoadBalancer Service（用于云环境，可选）
apiVersion: v1
kind: Service
metadata:
  name: trafficgen-loadbalancer
  namespace: trafficgen
  labels:
    app: trafficgen
    component: api
  annotations:
    # AWS
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # GCP
    # cloud.google.com/load-balancer-type: "Internal"
    # Azure
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: trafficgen

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: trafficgen
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: prometheus

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: trafficgen
  labels:
    app: grafana
    component: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: grafana
