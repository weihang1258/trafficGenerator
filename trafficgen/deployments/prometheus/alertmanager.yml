global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'your-password-here'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'team-email'

  routes:
    - match:
        severity: critical
      receiver: 'team-email-critical'
      continue: false

    - match:
        severity: warning
      receiver: 'team-email'
      continue: false

receivers:
  - name: 'team-email'
    email_configs:
      - to: 'team@example.com'
        send_resolved: true
        headers:
          Subject: '[TrafficGen] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'

  - name: 'team-email-critical'
    email_configs:
      - to: 'oncall@example.com'
        send_resolved: true
        headers:
          Subject: '[TrafficGen CRITICAL] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
    webhook_configs:
      - url: 'http://webhook.example.com/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
